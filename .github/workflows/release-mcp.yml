name: release MCP server

on:
  push:
    tags:
      - "timeline-mcp-v*"

concurrency:
  group: release-mcp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  registry-compatibility:
    if: github.repository == 'open-covenant/covenant-timeline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.31.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@12.0.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/check-mcp-release.mjs "$GITHUB_REF_NAME"
      - run: test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
      - run: git merge-base --is-ancestor HEAD origin/main

      - id: artifact
        name: Build disposable MCP package
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/registry-compatibility"
          mkdir -p "$destination"
          pnpm --dir packages/mcp-server pack --pack-destination "$destination"
          archive="$(find "$destination" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify registry dependency graph
        run: >-
          node scripts/check-mcp-registry-install.mjs
          "${{ steps.artifact.outputs.archive }}"

      - run: git diff --exit-code

  publish:
    needs: registry-compatibility
    if: github.repository == 'open-covenant/covenant-timeline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.31.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@12.0.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/check-mcp-release.mjs "$GITHUB_REF_NAME"
      - run: test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
      - run: git merge-base --is-ancestor HEAD origin/main
      - run: pnpm verify
      - run: pnpm audit
      - run: git diff --exit-code

      - id: metadata
        name: Resolve npm distribution tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/mcp-server/package.json").version')"
          dist_tag="latest"
          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          fi
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - id: artifact
        name: Build reproducible MCP package
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/release-mcp-first"
          second="$RUNNER_TEMP/release-mcp-second"
          mkdir -p "$first" "$second"
          pnpm --dir packages/mcp-server pack --pack-destination "$first"
          pnpm --dir packages/mcp-server pack --pack-destination "$second"
          archive="$(find "$first" -maxdepth 1 -name '*.tgz' -print -quit)"
          comparison="$(find "$second" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$archive"
          test -n "$comparison"
          cmp "$archive" "$comparison"
          (
            cd "$(dirname "$archive")"
            sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
          )
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"

      - id: sbom
        name: Generate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          sbom="$RUNNER_TEMP/timeline-mcp.spdx.json"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            node scripts/generate-sbom.mjs "$sbom" packages/mcp-server
          echo "path=$sbom" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timeline-mcp-release
          if-no-files-found: error
          path: |
            ${{ steps.artifact.outputs.archive }}
            ${{ steps.artifact.outputs.checksum }}
            ${{ steps.sbom.outputs.path }}

      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}

      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}
          sbom-path: ${{ steps.sbom.outputs.path }}

      - name: Retain release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.artifact.outputs.archive }}"
          checksum="${{ steps.artifact.outputs.checksum }}"
          sbom="${{ steps.sbom.outputs.path }}"
          version="$(node -p 'require("./packages/mcp-server/package.json").version')"
          archive_name="$(basename "$archive")"
          checksum_name="$(basename "$checksum")"
          sbom_name="$(basename "$sbom")"
          release_state="$RUNNER_TEMP/timeline-mcp-release-state.json"
          expected_prerelease=false
          release_flags=()
          if [[ "$version" == *-* ]]; then
            expected_prerelease=true
            release_flags+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" \
            --json isDraft,isPrerelease,tagName,assets \
            > "$release_state" 2>/dev/null; then
            node scripts/check-github-release-state.mjs \
              "$release_state" "$GITHUB_REF_NAME" "$expected_prerelease" \
              allow-missing "$archive_name" "$checksum_name" "$sbom_name"
            gh release upload "$GITHUB_REF_NAME" \
              "$archive" "$checksum" "$sbom" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$archive" "$checksum" "$sbom" \
              --verify-tag \
              --title "@covenant-org/timeline-mcp $version" \
              "${release_flags[@]}" \
              --notes "Installable alpha release of Covenant Timeline's local stdio MCP server."
          fi
          gh release view "$GITHUB_REF_NAME" \
            --json isDraft,isPrerelease,tagName,assets \
            > "$release_state"
          node scripts/check-github-release-state.mjs \
            "$release_state" "$GITHUB_REF_NAME" "$expected_prerelease" \
            complete "$archive_name" "$checksum_name" "$sbom_name"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package="@covenant-org/timeline-mcp"
          version="$(node -p 'require("./packages/mcp-server/package.json").version')"
          archive="${{ steps.artifact.outputs.archive }}"
          published="$RUNNER_TEMP/published-mcp.tgz"

          if tarball_url="$(npm view "$package@$version" dist.tarball --json 2>/dev/null)"; then
            tarball_url="${tarball_url%\"}"
            tarball_url="${tarball_url#\"}"
            curl --fail --location --silent --show-error \
              --output "$published" "$tarball_url"
            cmp "$archive" "$published"
            echo "$package@$version is already published with identical bytes"
          else
            npm publish "$archive" \
              --access public \
              --provenance \
              --tag "${{ steps.metadata.outputs.dist-tag }}"
          fi
