name: release

on:
  push:
    tags:
      - "timeline-v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'open-covenant/covenant-timeline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.31.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@12.0.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: git merge-base --is-ancestor HEAD origin/main
      - run: pnpm verify
      - run: pnpm audit
      - run: git diff --exit-code

      - id: metadata
        name: Resolve npm distribution tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/prototype/package.json").version')"
          dist_tag="latest"
          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          fi
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - id: artifact
        name: Build reproducible package
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/release-first"
          second="$RUNNER_TEMP/release-second"
          mkdir -p "$first" "$second"
          pnpm --dir packages/prototype pack --pack-destination "$first"
          pnpm --dir packages/prototype pack --pack-destination "$second"
          archive="$(find "$first" -maxdepth 1 -name '*.tgz' -print -quit)"
          comparison="$(find "$second" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$archive"
          test -n "$comparison"
          cmp "$archive" "$comparison"
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"

      - id: sbom
        name: Generate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          sbom="$RUNNER_TEMP/timeline.spdx.json"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            node scripts/generate-sbom.mjs "$sbom"
          echo "path=$sbom" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timeline-release
          if-no-files-found: error
          path: |
            ${{ steps.artifact.outputs.archive }}
            ${{ steps.artifact.outputs.checksum }}
            ${{ steps.sbom.outputs.path }}

      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}

      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}
          sbom-path: ${{ steps.sbom.outputs.path }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          npm publish "${{ steps.artifact.outputs.archive }}"
          --access public
          --provenance
          --tag "${{ steps.metadata.outputs.dist-tag }}"
